name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate required build vars
        env:
          SATFLOW_URL: ${{ vars.SATFLOW_URL }}
          NEXT_PUBLIC_ROOT_DOMAIN: ${{ vars.NEXT_PUBLIC_ROOT_DOMAIN }}
        run: |
          missing=()
          [ -z "$SATFLOW_URL" ] && missing+=("SATFLOW_URL")
          [ -z "$NEXT_PUBLIC_ROOT_DOMAIN" ] && missing+=("NEXT_PUBLIC_ROOT_DOMAIN")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing GitHub Actions Variables: ${missing[*]}"
            echo "Set them under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bemp" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          build-args: |
            SATFLOW_URL=${{ vars.SATFLOW_URL }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ vars.NEXT_PUBLIC_ROOT_DOMAIN }}
          cache-from: type=gha,scope=bemp
          cache-to: type=gha,mode=max,scope=bemp

      - name: Deploy
        env:
          WEBHOOK_URL: ${{ secrets.EASYPANEL_WEBHOOK_BEMP }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "EASYPANEL_WEBHOOK_BEMP secret not set — skipping deploy."
            exit 0
          fi
          curl -fsSL -X POST "$WEBHOOK_URL" --max-time 30 \
            || echo "Deploy webhook failed (non-fatal)"
