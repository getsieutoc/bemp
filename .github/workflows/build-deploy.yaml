name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bemp" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            SATFLOW_URL=${{ vars.SATFLOW_URL }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ vars.NEXT_PUBLIC_ROOT_DOMAIN }}
          cache-from: type=gha,scope=bemp
          cache-to: type=gha,mode=max,scope=bemp

      - name: Deploy
        env:
          WEBHOOK_URL: ${{ secrets.EASYPANEL_WEBHOOK_BEMP }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "EASYPANEL_WEBHOOK secret not set — skipping deploy."
            exit 0
          fi
          curl -fsSL -X POST "$WEBHOOK_URL" --max-time 30 \
            || echo "Deploy webhook failed (non-fatal)"
